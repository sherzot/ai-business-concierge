name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public, non-production placeholders. Tests mock all network calls;
      # these values only let config.ts initialize on a clean CI runner.
      VITE_SUPABASE_PROJECT_ID: cicicicicicicicicici
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      VITE_SUPABASE_URL: https://cicicicicicicicicici.supabase.co
      VITE_API_BASE_URL: https://cicicicicicicicicici.supabase.co/functions/v1/bright-api/make-server-6c2837d6/v1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.1.14"

      - name: Deno backend targeted tests
        working-directory: .
        run: |
          deno test \
            supabase/functions/telegram-bot/webhook-security.test.ts \
            supabase/functions/server/services/hr-candidate/github-analyzer.test.ts \
            supabase/functions/server/services/hr-candidate/cv-parser.test.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.test.ts \
            supabase/functions/server/services/hr-candidate/quota.test.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.test.ts \
            supabase/functions/server/services/hr-candidate/index.test.ts \
            supabase/functions/server/services/hr-candidate/schema.test.ts

      - name: Deno backend quality checks
        working-directory: .
        run: |
          deno fmt --check \
            supabase/functions/telegram-bot/index.ts \
            supabase/functions/telegram-bot/webhook-security.ts \
            supabase/functions/telegram-bot/webhook-security.test.ts \
            supabase/functions/server/services/hr-candidate/github-analyzer.ts \
            supabase/functions/server/services/hr-candidate/github-analyzer.test.ts \
            supabase/functions/server/services/hr-candidate/cv-parser.ts \
            supabase/functions/server/services/hr-candidate/cv-parser.test.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.test.ts \
            supabase/functions/server/services/hr-candidate/quota.ts \
            supabase/functions/server/services/hr-candidate/quota.test.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.test.ts \
            supabase/functions/server/services/hr-candidate/index.ts \
            supabase/functions/server/services/hr-candidate/index.test.ts \
            supabase/functions/server/services/hr-candidate/schema.test.ts \
            supabase/functions/server/routes/hr-candidate.ts
          deno check \
            supabase/functions/telegram-bot/index.ts \
            supabase/functions/server/services/hr-candidate/github-analyzer.test.ts \
            supabase/functions/server/services/hr-candidate/cv-parser.test.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.test.ts \
            supabase/functions/server/services/hr-candidate/quota.test.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.test.ts \
            supabase/functions/server/services/hr-candidate/index.test.ts \
            supabase/functions/server/services/hr-candidate/schema.test.ts
          deno lint \
            supabase/functions/server/services/hr-candidate/cv-parser.ts \
            supabase/functions/server/services/hr-candidate/cv-parser.test.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.ts \
            supabase/functions/server/services/hr-candidate/request-boundary.test.ts \
            supabase/functions/server/services/hr-candidate/quota.ts \
            supabase/functions/server/services/hr-candidate/quota.test.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.ts \
            supabase/functions/server/services/hr-candidate/http-adapter.test.ts \
            supabase/functions/server/services/hr-candidate/index.ts \
            supabase/functions/server/services/hr-candidate/index.test.ts \
            supabase/functions/server/services/hr-candidate/schema.test.ts \
            supabase/functions/server/routes/hr-candidate.ts

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Deployment environment guard tests
        run: npm run test:deploy-env

      - name: Production dependency audit
        run: npm run audit:production

      - name: Production build
        run: npm run build

      - name: Bundle and hosting security checks
        run: npm run security:check
