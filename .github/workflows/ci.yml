name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public, non-production placeholders. Tests mock all network calls;
      # these values only let config.ts initialize on a clean CI runner.
      VITE_SUPABASE_PROJECT_ID: ci-test-project
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      VITE_SUPABASE_URL: https://ci-test-project.supabase.co
      VITE_API_BASE_URL: https://ci-test-project.supabase.co/functions/v1/bright-api/make-server-6c2837d6/v1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production dependency audit
        run: npm run audit:production

      - name: Production build
        run: npm run build

      - name: Bundle and hosting security checks
        run: npm run security:check
